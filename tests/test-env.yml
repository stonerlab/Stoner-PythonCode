name: test-environment
channels:
  - defaults
  - phygbu
  - conda-forge
dependencies:
  - python >=3.12
  - pip

  # Test and coverage tools
  - coveralls
  - coverage
  - pytest
  - pytest-cov
  - pytest-forked
  - pytest-xdist

  # Required runtime dependencies (keep aligned with recipe/meta.yaml)
  - asteval
  - chardet >=5.2.0
  - h5py
  - lmfit >=1.3
  - looseversion >=1.0
  - matplotlib >=3.8
  - multiprocess >=0.70
  - numpy >=2.0
  - packaging
  - pandas >=2.2
  - pillow
  - python-dateutil >=2.8.0
  - scikit-image >=0.24
  - scipy >=1.14
  - statsmodels
  - xarray >=2024.10

  # Optional features exercised by tests and documentation examples
  - cycler >=0.10.0
  - fabio
  - filemagic >=1.6
  - conda-forge::libmagic >=5.48
  - image-registration >=0.2.1
  - imreg_dft >=2.0
  - matplotlib-scalebar
  - nptdms >=1.9.0
  - pytesseract
  - rosettasciio
  - seaborn >=0.13
  - tabulate >=0.9
  - tesseract
