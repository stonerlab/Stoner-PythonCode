[Options]
model: Stoner.analysis.fitting.models.superconductivity.Strijkers
# Controls whether the data and fit are plotted or not.
show_plot: True
# Sets whether to print a nice report to the console
print_report: True
# Save the final result ?
save_fit: False
# Plot the raw data and each preprocessing step for diagnosis.
diagnostics: False
#
# These are optional options that turn on various (experimental) bits of code
#
#This turns on the normalisation
normalise: False
# This turns on the fitting a quadratic to the outer 10% to determine the normalisation
# Don't use it unless you know why this might be sensible for your data !
fancy_normaliser: False
# Turns on rescaling the V axis into mV
# Only use if data not already correctly scaled.
rescale_v: False
# Tries to find and remove an offset in V by looking for peaks within 5 Delta
# Warning, this may go badly wrong with certain DC waveforms
remove_offset: False
# Be clever about annotating the result on the plots
# Decomposes the data into symmetric and antisymmetric parts before fitting
decompose: True
fancy_result: True
#
# Can switch between a least-squares fitting algorithm based on the lmfit module, or othogonal distance regression "odr"
method=lmfit

# These settings will read old style files directly
[Data]
x: V
y: G
# Optional uncertainty column, by header or zero-based column index:
# e: dG
# Optional filename; omitted (or False) opens a dialog unless supplied on the command line.
# filename: ../sample-data/PCAR Co Data.csv
# This will load from a csv file, comment out to have it guess the file type
type: CSVFile
# CSV layout reference. Known issue #41: cfg_data_from_ini currently ignores these entries:
# https://github.com/stonerlab/Stoner-PythonCode/issues/41
# Custom layouts currently require direct Data.load(..., filetype="CSVFile", ...).
# The CSVFile loader uses ZERO-BASED row numbers. Set header_line: None for no header
# and use numeric x/y/e selectors. Header and numerical delimiters can differ.
header_line: 0
data_line: 1
header_delim: ,
data_delim: ,
# Set either delimiter to None for automatic detection. For a preamble or intervening
# lines, change header_line and data_line independently; see PCAR-New.ini for an example.
# Historical start_line/separator entries are now data_line and header_delim/data_delim.
# Only need v_scale if rescale_v is true
v_scale:1000
# Only need this if normalise is True and fancy_normaliser is False
Normal_conductance: 0.0
# Set true to discard data at high bias
discard: False
# Bias limit to discard at
v_limit: 10.0


# The next four sections set the parameters up
[omega]
#starting value
value:0.55
# Allow this parameter to vary in the fix
vary: True
#Lower bound is set
min: 0.0
# Would give upper limit if it were constrained
# Just comment out limits which are not set
#max: None
# Symbol for plot annotations
label: \omega
# Default step size 0 . Use in conjunction with vary,min and max when mapping a parameter
step: 0.0
# Defines the units label for the plots
units: meV

[delta]
value: 1.5
vary: True
min: 0.5
max: 2.0
label: \Delta
step: 0.2
units: meV

[P]
value: 0.5
vary: False
min: 0.2
max: 0.54
label: P
step: 0.025

[Z]
value: 0.17
vary: True
min: 0.0
#max: None
label: Z
step: 0.0
