[Options]
# This is the model used to fit the data - do not change!
model: Stoner.analysis.fitting.models.superconductivity.Strijkers
# model: Stoner.analysis.fitting.models.superconductivity.Woods_Ballistic
# model: Stoner.analysis.fitting.models.superconductivity.Woods_Diffusive
# Controls whether the data and fit are plotted or not.
show_plot: True
# Sets whether to print a nice report to the console
print_report: True
# Save the final result ?
save_fit: True
# Plot the raw data and each preprocessing step for diagnosis.
diagnostics: False
# #####################################################################################################################
# These are optional options that turn on various (experimental) bits of code - only use once manual fitting is done
# #####################################################################################################################
#This turns on the normalisation
normalise: False
# This turns on the fitting a quadratic to the outer 10% to determine the normalisation
# Don't use it unless you know why this might be sensible for your data !
fancy_normaliser: False
# This allows us to customise the normaliser used - default is just a quadratic - either a function in the global
# namespace, or a fully dotted package.module.function name.

#normaliser_function = quadratic_abs

# This is the name of a function to use as a preprocessor - function must be in global namespace.

#preprocessor = down_only

# Turns on rescaling the V axis into mV
# Only use if data not already correctly scaled.
rescale_v: False
# Tries to find and remove an offset in V by looking for peaks within 5 Delta
# Warning, this may go badly wrong with certain DC waveforms
remove_offset: False
# Decomposes the data into symmetric and antisymmetric parts before fitting
decompose: True
# Be clever about annotating the result on the plots
fancy_result: True
#
# Minimization technique - options are:
#   - lmfit - based on lmfit module
#   - odr - based on scipy.odr module
#   - differential-evolution - use the scipy.optimize.differential evolution function
method=lmfit

# These settings will read old style files directly
[Data]
# This will load from a csv file, comment out to have it guess the file type
# csv files: use the registered CSVFile loader
x: V
y: G
# Optional uncertainty column, by header or zero-based column index:
# e: dG
# Optional data filename; omitted (or False) opens a dialog unless supplied on the command line.
# filename: ../sample-data/PCAR Co Data.csv
type: CSVFile
# CSV layout reference: these are the current CSVFile loader option names.
# Known issue #41: cfg_data_from_ini currently ignores these layout entries.
# https://github.com/stonerlab/Stoner-PythonCode/issues/41
# Until fixed, custom layouts require direct Data.load(..., filetype="CSVFile", ...).
# Row numbers are ZERO-BASED:
# headers on the first line and numerical data starting on the second line.
# Set header_line: None for a file without column headers, then use numeric x/y/e selectors.
header_line: 0
data_line: 1
# Header and numerical separators can differ; set either to None for automatic detection.
header_delim: ,
data_delim: ,
# Example: a two-line preamble, header on line 3, one intervening line, data from line 5:
# header_line: 2
# data_line: 4
# header_delim: |
# data_delim: ;
# Historical start_line/separator entries are now data_line and header_delim/data_delim.
# These settings will load from the PCAR lab directly (also turn on normalising and v scaling)
# TDI/text files: use the registered DataFile loader
# x: Direct V
# y: dI/dV
# type: DataFile
# Only need v_scale if rescale_v is true
v_scale:1000
# Only need this if normalise is True and fancy_normaliser is False
Normal_conductance: 0.0
# Used to set the fraction of the x-range used to fit the background
background_fraction=0.75
# Set true to discard data at high bias
discard: False
# Bias limit to discard at
v_limit: 10.0


# The next four sections set the parameters up
[omega]
#starting value
value:0.55
# Allow this parameter to vary in the fix
vary: True
#Lower bound is set
min: 0.0
# Would give upper limit if it were constrained
# Just comment out limits which are not set
#max: None
# Symbol for plot annotations
label: \omega
# Default step size 0 . Use in conjunction with vary,min and max when mapping a parameter
step: 0.0
# Defines the units label for the plots
units: meV

[delta]
value: 1.5
vary: True
min: 0.5
max: 2.0
label: \Delta
step: 0.2
units: meV

[P]
value: 0.5
vary: True
min: 0.2
max: 0.7
label: P
step: 0.05

[Z]
value: 0.17
vary: True
min: 0.0
#max: None
label: Z
step: 0.0
