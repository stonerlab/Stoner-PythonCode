name: Build Documentation

on:
  workflow_dispatch:
  release:
    types: ['released', 'prereleased']

# workflow_dispatch:        # Un comment line if you also want to trigger action manually

jobs:
  build-docs:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Build the same immutable release tag as the package workflows.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: doc/docs-env.yml
          environment-name: docs-build
          create-args: >-
            python=3.13
            --channel-priority flexible
          init-shell: bash
          cache-downloads: true
          cache-environment: true

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python maintenance/check-release-version.py --tag "$RELEASE_TAG"

      - name: Install package and remaining requirements
        run: pip install .

      - name: Build documentation
        env:
          MPLBACKEND: Agg
          READTHEDOCS: True
        run: |
          cd doc
          make html
