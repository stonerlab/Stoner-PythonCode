name: Package validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-distributions:
    name: Installed distributions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and source archive
        run: |
          python -m pip install build==1.2.2
          python -m build
      - name: Check archive contents
        run: python maintenance/check-distribution-archives.py dist
      - name: Install and exercise each distribution separately
        shell: bash
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            environment="${RUNNER_TEMP}/stoner-${kind}"
            python -m venv "${environment}"
            if [[ "${kind}" == wheel ]]; then
              packages=("${GITHUB_WORKSPACE}"/dist/*.whl)
            else
              packages=("${GITHUB_WORKSPACE}"/dist/*.tar.gz)
            fi
            [[ ${#packages[@]} -eq 1 ]]
            "${environment}/bin/python" -m pip install "${packages[0]}"
            (
              cd "${RUNNER_TEMP}"
              env -u PYTHONPATH "${environment}/bin/python" \
                "${GITHUB_WORKSPACE}/maintenance/check-installed-package.py" "${GITHUB_WORKSPACE}"
            )
          done
