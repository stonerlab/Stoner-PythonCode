
name: Conda

on:
  workflow_dispatch:
  release:
    types: ['released', 'prereleased']

# workflow_dispatch:        # Un comment line if you also want to trigger action manually

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Conda environment creation and activation
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: recipe/build-env.yml
          environment-name: build-environment
          create-args: python=3.12
          init-shell: bash
      - name: Check release version
        if: github.event_name == 'release'
        shell: bash -l {0}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python maintenance/check-release-version.py --tag "$RELEASE_TAG"
      - name: Build and test Conda package
        id: conda_build
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda build recipe --python=3.12 --no-anaconda-upload \
            --override-channels --channel phygbu --channel conda-forge \
            --output-folder "$RUNNER_TEMP/stoner-conda"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/stoner-conda/noarch/"*.conda)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected one Conda archive, found ${#packages[@]}."
            exit 1
          fi
          if [[ ! -s "${packages[0]}" ]]; then
            echo "::error::The Conda archive is empty."
            exit 1
          fi
          printf 'archive=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload Conda package
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA }}
          CONDA_ARCHIVE: ${{ steps.conda_build.outputs.archive }}
        run: |
          set -euo pipefail
          test -s "$CONDA_ARCHIVE"
          anaconda upload --user phygbu --label main --force "$CONDA_ARCHIVE"

  pypi_deployment:
    name: PyPI deployment of package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python maintenance/check-release-version.py --tag "$RELEASE_TAG"
      - name: Install build tools
        run: pip install build==1.2.2
      - name: Build package
        run: python -m build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          password: ${{ secrets.PYPI }}
