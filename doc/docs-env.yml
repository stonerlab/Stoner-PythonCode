name: rtd-build
channels:
  - defaults
  - phygbu
  - conda-forge
dependencies:
  - python >=3.13
  - pip

  # Documentation toolchain
  - graphviz
  - sphinx >=5.3
  - sphinx-automodapi >=0.16
  - sphinx-better-theme >=0.1.3
  - pillow
  - cycler >=0.10.0
  - matplotlib-scalebar

  # Required runtime dependencies for autodoc imports
  - asteval
  - chardet >=5.2.0
  - h5py
  - lmfit >=1.3
  - looseversion >=1.0
  - matplotlib >=3.8
  - multiprocess >=0.70
  - numpy >=2.0
  - packaging
  - pandas >=2.2
  - python-dateutil >=2.8
  - scikit-image >=0.24
  - scipy >=1.14
  - statsmodels
  - xarray >=2024.10

  # Used by examples when a cached graphic must be regenerated
  - seaborn >=0.13
  - tabulate >=0.9
