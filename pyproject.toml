[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Stoner"
dynamic = ["version"]
description = "Library to help write data analysis tools for experimental condensed matter physics."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [
    {name = "Gavin Burnell", email = "g.burnell@leeds.ac.uk"},
]
keywords = ["Data-Analysis", "Physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "asteval",
    "chardet>=5.2.0",
    "h5py",
    "lmfit>=1.3",
    "looseversion>=1.0",
    "matplotlib>=3.8",
    "multiprocess>=0.70",
    "numpy>=2.0",
    "packaging",
    "pandas",
    "Pillow",
    "python-dateutil>=2.8.0",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "statsmodels",
]

[project.optional-dependencies]
PrettyPrint = ["tabulate>=0.9"]
mimetype_detection = ["filemagic>=1.6"]
TDMS = ["npTDMS>=1.9.0"]
numba = ["numba"]
cv2 = ["opencv-python"]
image_alignment = ["imreg_dft>=2.0", "image-registration>=0.2.1"]
plot_styles = ["seaborn>=0.13"]
facility_formats = ["fabio", "rosettasciio"]
hyperspy = ["hyperspy"]
ocr = ["pytesseract"]
mayavi = ["mayavi"]
qt = ["PyQt5"]

[project.urls]
Homepage = "https://github.com/stonerlab/Stoner-PythonCode"
Repository = "https://github.com/stonerlab/Stoner-PythonCode"

[tool.setuptools.dynamic]
version = {attr = "Stoner.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["Stoner*"]
namespaces = false

[tool.setuptools.package-data]
"Stoner.plot" = ["stylelib/*.mplstyle"]
"Stoner.Image" = ["tessdata/*"]

[tool.coverage.run]
branch = true
source = ["Stoner"]
relative_files = true

[tool.pydocstyle]
ignore = ["D203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
